name: orderops-test

services:
  postgres-test:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: orderops_test
      POSTGRES_USER: orderops_test
      POSTGRES_PASSWORD: orderops_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderops_test -d orderops_test"]
      interval: 5s
      timeout: 5s
      retries: 12
